name = "occultviision-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 database (already provisioned live on the account, Session 5) ---
[[d1_databases]]
binding = "DB"
database_name = "occultviision-db"
database_id = "481b2745-1558-4018-925b-4f8dbc62d4d5"

# --- KV namespace for sessions / rate-limit counters / trial-tracking ---
[[kv_namespaces]]
binding = "SESSIONS"
id = "c384e9b815c3407e9501807b11b5094a"

# --- Secrets (set via `wrangler secret put <NAME>`, never committed) ---
# OTP_PROVIDER_API_KEY      -> SMS gateway (e.g. MSG91) for OTP send/verify
# WHATSAPP_API_KEY          -> Interakt (default per ARCHITECTURE.md, unconfirmed)
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# JWT_SIGNING_SECRET        -> session token signing

[vars]
# Non-secret config only. Environment-specific values, not credentials.
ENVIRONMENT = "development"

# DEV_OTP_BYPASS -- OFF by default on purpose. Set to the literal string
# "true" (not boolean true -- wrangler vars are strings) ONLY when you want
# to test the auth -> kundali flow without a real SMS gateway wired up.
# When "true" AND ENVIRONMENT != "production": /auth/request-otp skips the
# real SMS send and accepts the fixed code 000000 on /auth/verify-otp
# instead. See src/lib/otp.ts (isDevOtpBypassActive) for the exact gate.
#
# MUST be "false" (or removed) before any production deploy. It is also
# hard-blocked from working if ENVIRONMENT="production", as a second gate --
# but don't rely on that alone. Flip this back to "false" before launch.
DEV_OTP_BYPASS = "false"
