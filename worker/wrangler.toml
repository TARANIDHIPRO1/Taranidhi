name = "occultviision-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Static site (PWA frontend) ---
# Using [assets] (Workers Static Assets, wrangler v3+) which binds as env.ASSETS
# NOT [site] (old Workers Sites) which bound as __STATIC_CONTENT — that was the
# root cause of the "TaraNidhi Loading..." bug: env.ASSETS was undefined under [site].
[assets]
directory = "../frontend/dist"

# --- D1 database (already provisioned live on the account, Session 5) ---
[[d1_databases]]
binding = "DB"
database_name = "occultviision-db"
database_id = "481b2745-1558-4018-925b-4f8dbc62d4d5"

# --- KV namespace for sessions / rate-limit counters / trial-tracking ---
[[kv_namespaces]]
binding = "SESSIONS"
id = "c384e9b815c3407e9501807b11b5094a"

# --- Secrets (set via `wrangler secret put <NAME>`, never committed) ---
# OTP_PROVIDER_API_KEY      -> SMS gateway (e.g. MSG91) for OTP send/verify
# WHATSAPP_API_KEY          -> Interakt (default per ARCHITECTURE.md, unconfirmed)
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# JWT_SIGNING_SECRET        -> session token signing
# POINTS_TO_PAISE_RATE      -> how many paise 1 wallet point is worth, when
#                              funding a paise-denominated order from the
#                              wallet (routes/orders.ts). NOT a secret really,
#                              but kept here rather than [vars] since it's a
#                              pricing decision, not dev config. Deliberately
#                              UNSET until Naveen finalizes Premium/Ultra
#                              pricing (ARCHITECTURE.md Section 12, item 1) --
#                              /orders/:id/fund/wallet returns a clear 503
#                              until this is set. Do not guess a number here.

[vars]
# Non-secret config only. Environment-specific values, not credentials.
ENVIRONMENT = "beta"

# FRONTEND_ORIGIN -- CORS allow list.
# Beta: wildcard to cover the workers.dev URL assigned at deploy time.
# Production: set to https://www.occultviision.com before commercial launch.
FRONTEND_ORIGIN = "*"

# DEV_OTP_BYPASS -- ON for beta testing (no SMS gateway yet).
# Anyone on the beta URL can log in with OTP code 000000.
# FLIP TO "false" AND SET ENVIRONMENT="production" BEFORE COMMERCIAL LAUNCH.
DEV_OTP_BYPASS = "true"
