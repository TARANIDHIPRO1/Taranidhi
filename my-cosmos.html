<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b5a"><title>My Cosmos | TaraNidhi™</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap');

:root {
  --gold: #ffdc83;
  --gold2: #f6b83f;
  --ink: #f8f3e9;
  --muted: #d2d8f0;
  --line: #d9c9ff6b;
  --glass: rgba(9, 15, 58, .70);
  --blue: #08113c;
  --violet: #4d39a1;
  --green: #43f0a2;
  --dark-bg: #050a24;
  --panel-bg: rgba(7, 13, 52, .87);
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--dark-bg);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 14px 'DM Sans', system-ui, sans-serif;
  background: radial-gradient(ellipse at 50% 0%, #273b99 0, transparent 40%),
              radial-gradient(ellipse at 5% 38%, #173b9b 0, transparent 30%),
              radial-gradient(ellipse at 100% 62%, #442a9a 0, transparent 30%),
              linear-gradient(180deg, #050a24, #10134d 55%, #050b2d);
  overflow-x: hidden;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .65;
  background-image:
    radial-gradient(1px 1px at 7% 9%, #fff 0, transparent 2px),
    radial-gradient(1px 1px at 22% 35%, #ffe5a0 0, transparent 2px),
    radial-gradient(1px 1px at 76% 12%, #fff 0, transparent 2px),
    radial-gradient(1px 1px at 89% 45%, #fff 0, transparent 2px),
    radial-gradient(1px 1px at 44% 68%, #fff 0, transparent 2px),
    radial-gradient(1px 1px at 15% 83%, #d8d4ff 0, transparent 2px),
    radial-gradient(1px 1px at 68% 91%, #fff 0, transparent 2px);
  background-size: 100% 100%;
  z-index: -1;
}

button, a { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* LAYOUT */
.app {
  max-width: 1040px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: 94px;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px clamp(15px, 3vw, 28px);
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, rgba(5, 10, 36, 0.9), rgba(5, 10, 36, 0.7));
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255, 220, 131, 0.1);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid #ffdf8d;
  overflow: hidden;
  box-shadow: 0 0 24px #ffce6a45;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff5b9, #e5a73c 32%, #7c3d12 72%, #15133d);
  font-size: 28px;
  color: var(--gold);
}

.brand img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-copy strong {
  display: block;
  font: 700 27px 'Cormorant Garamond', serif;
  letter-spacing: .015em;
  color: #ffe9a9;
  line-height: 1;
}

.brand-copy span {
  display: block;
  font-size: 8px;
  letter-spacing: .16em;
  margin-top: 5px;
  color: #e7e4ff;
}

.header-tag {
  font-size: 9px;
  letter-spacing: .16em;
  line-height: 1.7;
  text-align: right;
  color: #e8d8a5;
  text-transform: uppercase;
}

/* NAVIGATION TABS */
.nav-tabs {
  display: flex;
  gap: 8px;
  padding: 15px clamp(12px, 2.5vw, 24px);
  background: linear-gradient(180deg, rgba(11, 16, 70, 0.5), rgba(5, 10, 36, 0.8));
  border-bottom: 1px solid rgba(217, 201, 255, 0.3);
  overflow-x: auto;
  flex: 1;
}

.tab-btn {
  border: 1px solid rgba(255, 220, 123, 0.5);
  background: linear-gradient(140deg, rgba(18, 23, 76, 0.6), rgba(7, 13, 56, 0.8));
  color: #d5d8f3;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13px;
  letter-spacing: .05em;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
  flex: 0 0 auto;
}

.tab-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 12px rgba(255, 220, 131, 0.2);
}

.tab-btn.active {
  background: linear-gradient(140deg, var(--violet), var(--gold2));
  color: var(--blue);
  border-color: var(--gold);
  font-weight: 600;
  box-shadow: 0 0 16px rgba(255, 220, 131, 0.3);
}

/* MAIN CONTENT */
.main-content {
  position: relative;
  z-index: 1;
}

.tab-section {
  display: none;
  padding: 0 clamp(12px, 2.5vw, 24px) 20px;
  animation: fadeIn 0.4s ease-in;
}

.tab-section.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* PANELS */
.panel {
  background: linear-gradient(120deg, rgba(7, 13, 52, .87), rgba(14, 19, 71, .76));
  border: 1px solid #f4d27f;
  border-radius: 20px;
  box-shadow: 0 0 0 1px #f5ce6933, 0 0 25px #f7c64c1b, inset 0 0 28px #5a5ed41b;
  backdrop-filter: blur(14px);
  margin: 14px clamp(12px, 2.5vw, 24px);
  padding: 17px 18px;
}

.panel-title {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  margin-bottom: 12px;
}

.title-left {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.round-icon {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border-radius: 50%;
  border: 1px solid #ffda7b;
  display: grid;
  place-items: center;
  color: #ffda7b;
  font-size: 24px;
  box-shadow: 0 0 16px #ffcc5933;
  background: linear-gradient(135deg, rgba(255, 220, 131, 0.1), rgba(77, 57, 161, 0.1));
}

.panel h2 {
  font: 700 22px 'Cormorant Garamond', serif;
  letter-spacing: .06em;
  color: #ffe294;
  margin: 0;
}

.pill {
  border: 1px solid #e8d5a9a8;
  border-radius: 99px;
  padding: 7px 13px;
  font-size: 9px;
  letter-spacing: .1em;
  white-space: nowrap;
  background: #ffffff09;
}

/* FORM STYLES */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 15px;
}

.form-group label {
  font: 700 12px 'DM Sans';
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #ffe294;
  text-shadow: 0 0 8px rgba(255, 220, 131, 0.1);
}

.form-group input,
.form-group textarea,
.form-group select {
  padding: 12px 15px;
  background: linear-gradient(140deg, rgba(18, 23, 76, 0.3), rgba(7, 13, 56, 0.5));
  border: 1px solid rgba(255, 220, 123, 0.4);
  border-radius: 12px;
  color: var(--ink);
  font: inherit;
  backdrop-filter: blur(8px);
  transition: all 0.3s ease;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: rgba(217, 201, 255, 0.4);
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--gold);
  background: linear-gradient(140deg, rgba(77, 57, 161, 0.2), rgba(255, 220, 131, 0.05));
  box-shadow: 0 0 12px rgba(255, 220, 131, 0.2);
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}

/* CARDS */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.card {
  padding: 15px;
  border: 1px solid rgba(255, 220, 123, 0.4);
  border-radius: 15px;
  background: linear-gradient(140deg, rgba(18, 23, 76, 0.4), rgba(7, 13, 56, 0.6));
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.card:hover {
  border-color: var(--gold);
  background: linear-gradient(140deg, rgba(77, 57, 161, 0.3), rgba(255, 220, 131, 0.08));
  transform: translateY(-3px);
  box-shadow: 0 0 16px rgba(255, 220, 131, 0.2);
}

.card-icon {
  font-size: 36px;
  color: var(--gold);
}

.card-title {
  font: 600 16px 'Cormorant Garamond', serif;
  color: #ffe294;
  margin: 0;
}

.card-subtitle {
  font-size: 11px;
  color: #d3d5f2;
  margin: 0;
}

/* BUTTONS */
.submit-btn {
  padding: 14px 32px;
  background: linear-gradient(135deg, var(--violet), var(--gold2));
  color: var(--blue);
  border: 1px solid var(--gold);
  border-radius: 12px;
  font: 700 14px 'DM Sans';
  letter-spacing: .05em;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 0 16px rgba(255, 220, 131, 0.2);
  text-transform: uppercase;
  width: 100%;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 24px rgba(255, 220, 131, 0.35);
}

.submit-btn:active {
  transform: translateY(0);
}

/* INFO BOXES */
.info-box {
  background: linear-gradient(140deg, rgba(18, 23, 76, 0.3), rgba(7, 13, 56, 0.5));
  border: 1px solid rgba(255, 220, 123, 0.4);
  border-radius: 15px;
  padding: 15px;
  margin: 12px 0;
  backdrop-filter: blur(8px);
}

.info-label {
  font-size: 10px;
  letter-spacing: .1em;
  color: #d3d5f2;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.info-value {
  font: 700 20px 'Cormorant Garamond', serif;
  color: var(--gold);
  margin: 0;
}

/* FOOTER */
.footer {
  text-align: center;
  font-size: 9px;
  color: #9fa9d8;
  padding: 15px 20px;
  border-top: 1px solid rgba(217, 201, 255, 0.2);
  margin: 20px clamp(12px, 2.5vw, 24px);
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, #060a2cf5 22%);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(217, 201, 255, 0.2);
}

.nav-inner {
  width: min(760px, 100%);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}

.nav-item {
  border: 0;
  background: transparent;
  color: #d5d8f3;
  padding: 5px 2px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  letter-spacing: .05em;
  cursor: pointer;
  transition: all 0.3s ease;
}

.nav-item .nav-icon {
  font-size: 24px;
  color: #f5d98c;
}

.nav-item.active {
  color: #ffe6a0;
  text-shadow: 0 0 12px #ffda6c55;
}

.nav-item.active .nav-icon {
  filter: drop-shadow(0 0 9px #ffd35c);
}

/* RESPONSIVE */
@media (max-width: 540px) {
  .header { padding: 12px 15px; }
  .brand-copy strong { font-size: 23px; }
  .logo { width: 41px; height: 41px; }
  .nav-tabs { gap: 6px; padding: 12px 10px; }
  .tab-btn { padding: 8px 14px; font-size: 12px; }
  .panel { margin: 11px 10px; padding: 14px 13px; border-radius: 17px; }
  .panel h2 { font-size: 18px; }
  .card-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .form-row { grid-template-columns: 1fr; }
}

@media (max-width: 360px) {
  .header-tag { display: none; }
  .brand-copy strong { font-size: 20px; }
  .nav-tabs { gap: 4px; }
  .tab-btn { padding: 6px 10px; font-size: 10px; }
  .card-icon { font-size: 28px; }
}

  height:91px!important;
  min-width:136px;
  flex:0 0 136px;
  border:0!important;
  border-radius:0!important;
  overflow:visible!important;
  background:transparent!important;
  box-shadow:none!important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  max-width:none!important;
  max-height:none!important;
  object-fit:contain!important;
  object-position:center!important;
  border-radius:0!important;
  clip-path:none!important;
  mix-blend-mode:normal!important;
}
.header{align-items:center}

/* PUBLIC THEME CHOOSER — each theme is a distinct palette, not a mixed overlay */
.theme-picker{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;padding:10px 0 12px}
.theme-picker-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-right:3px}
.theme-choice{border:1px solid currentColor;border-radius:999px;padding:7px 10px;background:transparent;color:inherit;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.theme-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #8888}
.theme-choice[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:2px}

/* Cream + Coffee Brown */

document.querySelectorAll('[data-toggle]').forEach(c=>{const toggle=()=>{const opened=c.getAttribute('aria-pressed')==='true';c.setAttribute('aria-pressed',String(!opened));const d=c.querySelector('.detail');if(d)d.hidden=opened;};c.addEventListener('click',toggle);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});});
</script><script>
(function(){
 const themes=[
  {id:'cosmic-blue',label:'Cosmic Blue',dot:'#171b5a'},
  {id:'emerald',label:'Dark Emerald',dot:'#06452f'},
  {id:'cream-maroon',label:'Divine Cream + Maroon',dot:'#f5efdf'},
  {id:'cream-coffee',label:'Divine Cream + Coffee',dot:'#f4eddf'},
  {id:'divine-vermilion',label:'Divine Cream + Vermilion',dot:'#fff0d8'}
 ];
 const root=document.documentElement;
 function applyTheme(id){if(!themes.some(t=>t.id===id))id='cosmic-blue';root.dataset.theme=id;document.body.dataset.theme=id;try{localStorage.setItem('taranidhi-public-theme',id)}catch(e){};document.querySelectorAll('.theme-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===id)));}
 function build(){const host=document.createElement('div');host.className='theme-picker';host.setAttribute('aria-label','Choose app colour theme');host.innerHTML='<span class="theme-picker-label">Color Theme</span>'+themes.map(t=>'<button type="button" class="theme-choice" data-theme-choice="'+t.id+'" aria-pressed="false"><span class="theme-dot" style="background:'+t.dot+'"></span>'+t.label+'</button>').join('');
 host.addEventListener('click',e=>{const b=e.target.closest('[data-theme-choice]');if(b)applyTheme(b.dataset.themeChoice)});
 const header=document.querySelector('.header');if(header)header.insertAdjacentElement('afterend',host);else{const main=document.querySelector('.main-content');if(main)main.prepend(host);}
 let saved='cosmic-blue';try{saved=localStorage.getItem('taranidhi-public-theme')||saved}catch(e){}applyTheme(saved);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();
})();
</script>
<script id="tn-space-first-navigation">
(function(){
 const pages=[['NOW','index.html'],['Kundali','kundali.html'],['Panchang','panchang.html'],['Hora & Lagna','hora-lagna.html'],['Astrological Query','query.html'],['Muhurta Finder','muhurta.html'],['Star Time','star-time.html'],['Moment','moment.html'],['Today','today.html'],['My Cosmos','my-cosmos.html'],['Advertisement','advertisement.html'],['Offers','offer.html'],['My Brand','personal-branding.html']];
 function setup(){
  const picker=document.querySelector('.theme-picker');
  if(picker&&!picker.querySelector('.theme-toggle')){
   const toggle=document.createElement('button');toggle.type='button';toggle.className='theme-toggle';toggle.setAttribute('aria-expanded','false');toggle.innerHTML='<span aria-hidden="true">◉</span><span class="tn-theme-tab">Color Theme</span><span aria-hidden="true">⌄</span>';
   picker.insertBefore(toggle,picker.firstChild);
   const current=()=>{const active=picker.querySelector('.theme-choice[aria-pressed="true"]');const label=active?active.textContent.trim():'Cosmic Blue';toggle.setAttribute('aria-label','Color Theme, current: '+label)};
   toggle.addEventListener('click',()=>{const open=picker.classList.toggle('theme-open');toggle.setAttribute('aria-expanded',String(open));current()});
   picker.addEventListener('click',e=>{if(e.target.closest('.theme-choice'))setTimeout(current,0)});current();
  }
  const header=document.querySelector('.header');
  if(header&&!header.querySelector('.page-menu-trigger')){
   const btn=document.createElement('button');btn.type='button';btn.className='page-menu-trigger';btn.innerHTML='☰ Pages';btn.setAttribute('aria-label','Open all app pages');header.appendChild(btn);
   const backdrop=document.createElement('div');backdrop.className='tn-drawer-backdrop';backdrop.innerHTML='<aside class="tn-drawer" role="dialog" aria-modal="true" aria-label="All TaraNidhi pages"><div class="tn-drawer-head"><strong>All Pages</strong><button type="button" class="tn-drawer-close">Close ✕</button></div>'+pages.map(p=>'<a href="'+p[1]+'">'+p[0]+' <span aria-hidden="true" style="margin-left:auto">›</span></a>').join('')+'</aside>';
   document.body.appendChild(backdrop);
   const close=()=>{backdrop.classList.remove('open');btn.setAttribute('aria-expanded','false')};
   btn.addEventListener('click',()=>{backdrop.classList.add('open');btn.setAttribute('aria-expanded','true')});
   backdrop.querySelector('.tn-drawer-close').addEventListener('click',close);
   backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});
   document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  }
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
</script><script src="tn-live.js" defer></script>
</body></html>
